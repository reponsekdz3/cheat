[project]
name = "rwanda-examination-integrity"
version = "0.1.0"
description = "Auditable examination integrity and case-review platform"
requires-python = ">=3.12"

[tool.pytest.ini_options]
pythonpath = ["apps/api"]
testpaths = ["apps/api/tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
